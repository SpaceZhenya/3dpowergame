   <!DOCTYPE html>
   <html>
   <head>
       <title>Моя первая 3D игра</title>
       <style>
           body { margin: 0; overflow: hidden; }
           canvas { display: block; }
       </style>
   </head>
   <body>
       <script type="importmap">
       {
           "imports": {
               "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
           }
       }
       </script>
       <script type="module">
           // ===== ШАГ 1: Сцена =====
           const scene = new THREE.Scene();
           scene.background = new THREE.Color(0x87CEEB);

           // ===== ШАГ 2: Камера =====
           const camera = new THREE.PerspectiveCamera(
               75,                                    // угол обзора
               window.innerWidth / window.innerHeight, // соотношение
               0.1,                                    // ближняя плоскость
               1000                                    // дальняя плоскость
           );
           camera.position.set(0, 10, 15);
           camera.lookAt(0, 0, 0);

           // ===== ШАГ 3: Рендерер =====
           const renderer = new THREE.WebGLRenderer({ antialias: true });
           renderer.setSize(window.innerWidth, window.innerHeight);
           document.body.appendChild(renderer.domElement);

           // ===== ШАГ 4: Свет =====
           const light = new THREE.DirectionalLight(0xffffff, 1);
           light.position.set(10, 20, 10);
           scene.add(light);
           scene.add(new THREE.AmbientLight(0xffffff, 0.5));

           // ===== ШАГ 5: Земля =====
           const ground = new THREE.Mesh(
               new THREE.PlaneGeometry(50, 50),
               new THREE.MeshLambertMaterial({ color: 0x4a5d23 })
           );
           ground.rotation.x = -Math.PI / 2;
           scene.add(ground);

           // ===== ШАГ 6: Игрок (куб) =====
           const player = new THREE.Mesh(
               new THREE.BoxGeometry(2, 2, 2),
               new THREE.MeshLambertMaterial({ color: 0x0066ff })
           );
           player.position.y = 1;
           scene.add(player);

           // ===== ШАГ 7: Управление =====
           const keys = {};
           document.addEventListener('keydown', (e) => keys[e.code] = true);
           document.addEventListener('keyup', (e) => keys[e.code] = false);

           // ===== ШАГ 8: Игровой цикл =====
           function animate() {
               requestAnimationFrame(animate);

               // Движение
               const speed = 0.2;
               if (keys['KeyW'] || keys['ArrowUp']) player.position.z -= speed;
               if (keys['KeyS'] || keys['ArrowDown']) player.position.z += speed;
               if (keys['KeyA'] || keys['ArrowLeft']) player.position.x -= speed;
               if (keys['KeyD'] || keys['ArrowRight']) player.position.x += speed;

               renderer.render(scene, camera);
           }
           animate();

           // ===== ШАГ 9: Ресайз окна =====
           window.addEventListener('resize', () => {
               camera.aspect = window.innerWidth / window.innerHeight;
               camera.updateProjectionMatrix();
               renderer.setSize(window.innerWidth, window.innerHeight);
           });
       </script>
   </body>
   </html>
